<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12284a">
<title>Jarvis</title>
<style>
  :root {
    --fondo: #12284a;
    --panel: #1b3560;
    --texto: #eef3f9;
    --suave: #9db3d1;
    --acento: #f5b83d;
    --acento-texto: #2a1d00;
    --error: #ff9a8a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fondo); color: var(--texto);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header { padding: 18px 20px 6px; display: flex; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 1.35rem; margin: 0; font-weight: 700; letter-spacing: .01em; }
  #estado { color: var(--suave); font-size: .95rem; }
  #log { flex: 1; overflow-y: auto; padding: 12px 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; white-space: pre-wrap; }
  .yo { align-self: flex-end; background: var(--acento); color: var(--acento-texto); border-bottom-right-radius: 4px; }
  .jarvis { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 4px; }
  .error { align-self: center; color: var(--error); font-size: .95rem; text-align: center; }
  .vacio { margin: auto; text-align: center; color: var(--suave); max-width: 22rem; line-height: 1.5; }
  footer { padding: 10px 20px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #mic {
    width: 84px; height: 84px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--acento); color: var(--acento-texto);
    display: grid; place-items: center; position: relative;
  }
  #mic svg { width: 36px; height: 36px; }
  #mic:focus-visible, #texto:focus-visible, #enviar:focus-visible { outline: 3px solid var(--texto); outline-offset: 3px; }
  #mic.escuchando::after {
    content: ""; position: absolute; inset: -10px; border-radius: 50%;
    border: 3px solid var(--acento); animation: latido 1.2s ease-out infinite;
  }
  @keyframes latido { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #mic.escuchando::after { animation: none; } }
  form { display: flex; gap: 8px; width: 100%; max-width: 32rem; }
  #texto { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--panel); background: var(--panel); color: var(--texto); font: inherit; }
  #texto::placeholder { color: var(--suave); }
  #enviar { padding: 0 16px; border-radius: 12px; border: 0; background: var(--panel); color: var(--texto); font: inherit; cursor: pointer; }
</style>
</head>
<body>
<header><h1>Jarvis</h1><span id="estado" aria-live="polite">Listo</span></header>
<main id="log" aria-live="polite">
  <p class="vacio" id="vacio">Tocá el micrófono y hablame. Por ejemplo: «¿Cuántos metros rinde un balde de 20 litros de látex?»</p>
</main>
<footer>
  <button id="mic" aria-label="Hablar con Jarvis">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
  </button>
  <form id="form">
    <input id="texto" type="text" placeholder="O escribile acá" autocomplete="off" aria-label="Mensaje">
    <button id="enviar" type="submit">Enviar</button>
  </form>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const log = $('log'), estado = $('estado'), mic = $('mic');
const historial = [];
let reconocimiento = null, escuchando = false, ocupado = false;

function setEstado(t) { estado.textContent = t; }

function agregar(clase, texto) {
  const v = $('vacio'); if (v) v.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + clase; d.textContent = texto;
  if (clase === 'error') d.className = 'error';
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}

function hablar(texto) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = 'es-AR';
  const voces = speechSynthesis.getVoices();
  const voz = voces.find(v => v.lang === 'es-AR') || voces.find(v => v.lang.startsWith('es'));
  if (voz) u.voice = voz;
  u.onstart = () => setEstado('Hablando…');
  u.onend = () => setEstado('Listo');
  speechSynthesis.speak(u);
}

async function enviar(texto) {
  texto = texto.trim();
  if (!texto || ocupado) return;
  ocupado = true;
  agregar('yo', texto);
  historial.push({ role: 'user', content: texto });
  setEstado('Pensando…');
  try {
    const headers = { 'content-type': 'application/json' };
    const codigo = localStorage.getItem('jarvis_codigo');
    if (codigo) headers['x-access-code'] = codigo;
    let r = await fetch('/api/chat', { method: 'POST', headers, body: JSON.stringify({ messages: historial }) });
    if (r.status === 401) {
      const nuevo = prompt('Ingresá tu código de acceso');
      if (nuevo) { localStorage.setItem('jarvis_codigo', nuevo); headers['x-access-code'] = nuevo;
        r = await fetch('/api/chat', { method: 'POST', headers, body: JSON.stringify({ messages: historial }) }); }
    }
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Algo salió mal');
    historial.push({ role: 'assistant', content: data.reply });
    agregar('jarvis', data.reply);
    hablar(data.reply);
  } catch (e) {
    historial.pop();
    agregar('error', e.message + '. Probá de nuevo.');
    setEstado('Listo');
  } finally { ocupado = false; if (!speechSynthesis.speaking) setEstado('Listo'); }
}

function iniciarVoz() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { agregar('error', 'Este navegador no reconoce voz. Usá Chrome o escribí el mensaje.'); return; }
  speechSynthesis.cancel();
  reconocimiento = new SR();
  reconocimiento.lang = 'es-AR';
  reconocimiento.interimResults = false;
  reconocimiento.onstart = () => { escuchando = true; mic.classList.add('escuchando'); setEstado('Escuchando…'); };
  reconocimiento.onresult = (e) => enviar(e.results[0][0].transcript);
  reconocimiento.onerror = (e) => { if (e.error !== 'no-speech' && e.error !== 'aborted') agregar('error', 'No pude usar el micrófono (' + e.error + '). Revisá los permisos.'); };
  reconocimiento.onend = () => { escuchando = false; mic.classList.remove('escuchando'); if (!ocupado) setEstado('Listo'); };
  reconocimiento.start();
}

mic.addEventListener('click', () => {
  if (escuchando) { reconocimiento.stop(); return; }
  if (speechSynthesis.speaking) { speechSynthesis.cancel(); setEstado('Listo'); return; }
  iniciarVoz();
});
$('form').addEventListener('submit', (e) => { e.preventDefault(); const t = $('texto').value; $('texto').value = ''; enviar(t); });
if ('speechSynthesis' in window) speechSynthesis.getVoices();
</script>
</body>
</html>
